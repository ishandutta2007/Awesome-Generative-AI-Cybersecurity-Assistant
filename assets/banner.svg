<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) scale(1); opacity: 0.4; }
      50% { transform: translateY(-12px) scale(1.15); opacity: 0.8; }
    }
    @keyframes pulseLine {
      0%, 100% { opacity: 0.15; stroke-dashoffset: 0; }
      50% { opacity: 0.45; stroke-dashoffset: 40; }
    }
    @keyframes nodeGlow {
      0%, 100% { r: 4px; opacity: 0.5; }
      50% { r: 7px; opacity: 0.9; }
    }
    .particle { animation: floatParticle 6s ease-in-out infinite; }
    .grid-line { animation: pulseLine 8s linear infinite; stroke-dasharray: 8 8; }
    .node { animation: nodeGlow 4s ease-in-out infinite; }
    .node-delay1 { animation-delay: 1.5s; }
    .node-delay2 { animation-delay: 3s; }
    .p-delay1 { animation-delay: 2s; }
    .p-delay2 { animation-delay: 4s; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- Background Decorative Grid Lines -->
  <g opacity="0.25">
    <line x1="0" y1="70" x2="1200" y2="70" stroke="#38bdf8" stroke-width="1" class="grid-line" />
    <line x1="0" y1="140" x2="1200" y2="140" stroke="#818cf8" stroke-width="1" class="grid-line" />
    <line x1="0" y1="210" x2="1200" y2="210" stroke="#38bdf8" stroke-width="1" class="grid-line" />
    <line x1="0" y1="280" x2="1200" y2="280" stroke="#818cf8" stroke-width="1" class="grid-line" />
    <line x1="0" y1="350" x2="1200" y2="350" stroke="#38bdf8" stroke-width="1" class="grid-line" />

    <line x1="150" y1="0" x2="150" y2="420" stroke="#38bdf8" stroke-width="1" class="grid-line" />
    <line x1="350" y1="0" x2="350" y2="420" stroke="#818cf8" stroke-width="1" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="420" stroke="#38bdf8" stroke-width="1" class="grid-line" />
    <line x1="850" y1="0" x2="850" y2="420" stroke="#818cf8" stroke-width="1" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="420" stroke="#38bdf8" stroke-width="1" class="grid-line" />
  </g>

  <!-- Ambient Glowing Orbs (Background) -->
  <circle cx="200" cy="100" r="140" fill="#0284c7" opacity="0.15" filter="url(#glow)" />
  <circle cx="1000" cy="300" r="160" fill="#6366f1" opacity="0.18" filter="url(#glow)" />
  <circle cx="600" cy="200" r="180" fill="#a855f7" opacity="0.12" filter="url(#glow)" />

  <!-- Animated Network Nodes (Background Layer) -->
  <g opacity="0.6">
    <circle cx="120" cy="80" r="5" fill="#38bdf8" class="node" />
    <circle cx="240" cy="180" r="4" fill="#818cf8" class="node node-delay1" />
    <circle cx="1080" cy="90" r="6" fill="#c084fc" class="node node-delay2" />
    <circle cx="960" cy="220" r="5" fill="#38bdf8" class="node node-delay1" />
    <circle cx="1020" cy="340" r="4" fill="#818cf8" class="node" />

    <line x1="120" y1="80" x2="240" y2="180" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" />
    <line x1="1080" y1="90" x2="960" y2="220" stroke="#c084fc" stroke-width="1.5" opacity="0.3" />
    <line x1="960" y1="220" x2="1020" y2="340" stroke="#818cf8" stroke-width="1.5" opacity="0.3" />
  </g>

  <!-- Shield Cyber Graphic Icon (Background Accent Left) -->
  <g transform="translate(65, 145)" opacity="0.25">
    <path d="M40 0 L80 20 L80 60 C80 90 40 110 40 110 C40 110 0 90 0 60 L0 20 Z" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#softGlow)" />
    <path d="M40 15 L65 28 L65 55 C65 77 40 92 40 92 C40 92 15 77 15 55 L15 28 Z" fill="#38bdf8" opacity="0.3" />
  </g>

  <!-- AI Brain / Circuit Graphic (Background Accent Right) -->
  <g transform="translate(1040, 140)" opacity="0.25">
    <rect x="0" y="0" width="80" height="80" rx="16" fill="none" stroke="#c084fc" stroke-width="3" filter="url(#softGlow)" />
    <circle cx="40" cy="40" r="18" fill="none" stroke="#818cf8" stroke-width="2" />
    <circle cx="40" cy="40" r="6" fill="#38bdf8" />
    <line x1="40" y1="0" x2="40" y2="22" stroke="#c084fc" stroke-width="2" />
    <line x1="40" y1="58" x2="40" y2="80" stroke="#c084fc" stroke-width="2" />
    <line x1="0" y1="40" x2="22" y2="40" stroke="#c084fc" stroke-width="2" />
    <line x1="58" y1="40" x2="80" y2="40" stroke="#c084fc" stroke-width="2" />
  </g>

  <!-- Main Foreground Content Container -->
  <!-- Header Badge -->
  <g transform="translate(60, 50)">
    <rect width="230" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="20" cy="16" r="5" fill="#10b981" />
    <text x="34" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="0.5">
      🛡️ CYBERSECURITY AI 2026
    </text>
  </g>

  <!-- Title Text -->
  <text x="60" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="url(#titleGrad)" filter="url(#softGlow)">
    Awesome Generative AI Cybersecurity Assistant
  </text>

  <!-- Subtitle Text -->
  <text x="60" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="url(#subGrad)">
    Curated Ecosystem of Enterprise SaaS Platforms, Agentic SOC Copilots &amp; Open-Source AI Security Tools
  </text>

  <!-- Foreground Metric Feature Cards -->
  <g transform="translate(60, 220)">
    <!-- Card 1: Enterprise SaaS -->
    <g transform="translate(0, 0)">
      <rect width="240" height="115" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect width="240" height="115" rx="12" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4" />
      <text x="20" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#38bdf8">10+ SaaS</text>
      <text x="20" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Enterprise Copilots</text>
      <text x="20" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Microsoft, CrowdStrike, Palo Alto</text>
    </g>

    <!-- Card 2: Open Source -->
    <g transform="translate(260, 0)">
      <rect width="240" height="115" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect width="240" height="115" rx="12" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.4" />
      <text x="20" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#818cf8">15+ Repos</text>
      <text x="20" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Open-Source Tools</text>
      <text x="20" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">PyRIT, Garak, SWE-agent, AiSOC</text>
    </g>

    <!-- Card 3: SOC Automation -->
    <g transform="translate(520, 0)">
      <rect width="240" height="115" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect width="240" height="115" rx="12" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.4" />
      <text x="20" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#c084fc">Autonomous</text>
      <text x="20" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">SOC Triage &amp; Hunting</text>
      <text x="20" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">KQL/FQL, Red Team, MCP</text>
    </g>

    <!-- Card 4: Market Dynamics -->
    <g transform="translate(780, 0)">
      <rect width="270" height="115" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect width="270" height="115" rx="12" fill="none" stroke="#34d399" stroke-width="1" opacity="0.4" />
      <text x="20" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#34d399">$14.8B</text>
      <text x="20" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Estimated Market by 2030</text>
      <text x="20" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Moderately Concentrated Sector</text>
    </g>
  </g>

  <!-- Bottom Footer Line -->
  <g transform="translate(60, 375)">
    <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">
      ⚡ Maintained by @ishandutta2007 • Updated October 2026 • Curated for Security Engineers &amp; AI Researchers
    </text>
  </g>
</svg>
